<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUYMANH HACKER SYSTEM V2</title>
    <style>
        :root {
            --neon-green: #0f0;
            --dark-bg: #000;
            --hacker-font: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: var(--hacker-font);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Canvas nền hiệu ứng Matrix */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Đẩy xuống nền */
            opacity: 0.5; /* Làm mờ để dễ nhìn giao diện chính */
        }

        /* Màn hình đăng nhập và ứng dụng chính */
        #login-screen, #main-app {
            position: relative; /* Nổi lên trên canvas */
            z-index: 10;
        }

        .login-box {
            border: 1px solid var(--neon-green);
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.4);
            text-align: center;
            background: rgba(0, 0, 0, 0.9); /* Nền đen mờ để che chữ matrix */
        }

        input {
            background: #000;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 10px;
            margin: 10px 0;
            outline: none;
            width: 200px;
            text-align: center;
        }

        button {
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:hover {
            box-shadow: 0 0 15px var(--neon-green);
        }

        /* Giao diện chính */
        #main-app {
            display: none;
            text-align: center;
            width: 100%;
            max-width: 400px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border: 1px solid var(--neon-green);
        }

        .header {
            font-size: 2.5em;
            margin-bottom: 10px;
            animation: flicker 2s infinite;
        }

        .coin-status {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: #ff0;
        }

        .display-area {
            font-size: 5em;
            height: 100px;
            margin: 10px 0;
            font-weight: bold;
        }

        .dots-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .dot {
            width: 25px;
            height: 25px;
            border: 2px solid var(--neon-green);
            border-radius: 50%;
        }

        .dot.active {
            background: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
        }

        /* Bàn phím Hacker */
        .keyboard {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 10px;
        }

        .num-key {
            width: 60px;
            height: 60px;
            border: 1px solid var(--neon-green);
            background: rgba(0, 255, 0, 0.1);
            color: var(--neon-green);
            font-size: 1.5em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .num-key:active {
            background: var(--neon-green);
            color: #000;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
            80% { opacity: 0.9; }
        }

        .error-msg { color: red; font-size: 0.8em; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- PHẦN TỬ CANVAS TẠO HIỆU ỨNG MATRIX CHẠY NỀN -->
    <canvas id="matrix-canvas"></canvas>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen">
        <div class="login-box">
            <h2 style="margin-top:0">SYSTEM ACCESS REQUIRED</h2>
            <input type="text" id="username" placeholder="USER ID"><br>
            <input type="password" id="password" placeholder="ACCESS CODE"><br>
            <button onclick="login()">ENTER SYSTEM</button>
            <div id="login-error" class="error-msg"></div>
        </div>
    </div>

    <!-- ỨNG DỤNG CHÍNH -->
    <div id="main-app">
        <div class="header">HUYMANH</div>
        <div class="coin-status">CREDITS: <span id="coin-count">100</span> XU</div>
        
        <div class="display-area" id="ai-result">_</div>

        <div class="dots-container">
            <div class="dot" id="d1"></div>
            <div class="dot" id="d2"></div>
            <div class="dot" id="d3"></div>
            <div class="dot" id="d4"></div>
        </div>

        <div class="keyboard">
            <div class="num-key" onclick="press(0)">0</div>
            <div class="num-key" onclick="press(1)">1</div>
            <div class="num-key" onclick="press(2)">2</div>
            <div class="num-key" onclick="press(3)">3</div>
            <div class="num-key" onclick="press(4)">4</div>
            <div class="num-key" onclick="press(5)">5</div>
            <div class="num-key" onclick="press(6)">6</div>
            <div class="num-key" onclick="press(7)">7</div>
            <div class="num-key" onclick="press(8)">8</div>
            <div class="num-key" onclick="press(9)">9</div>
        </div>
    </div>

    <script>
        // --- LOGIC HỆ THỐNG HUYMANH (Vẫn giữ nguyên từ bản trước) ---
        let coins = 100;
        let sequence = [];
        const loginData = { u: "huymanh123000", p: "huymanh123" };

        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const error = document.getElementById('login-error');

            if(user === loginData.u && pass === loginData.p) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
            } else {
                error.innerText = "ACCESS DENIED: INVALID CREDENTIALS";
                setTimeout(() => error.innerText = "", 2000);
            }
        }

        function press(num) {
            if (coins <= 0) {
                alert("HẾT XU! VUI LÒNG NẠP THÊM.");
                return;
            }

            if (sequence.length < 4) {
                sequence.push(num);
                document.getElementById(`d${sequence.length}`).classList.add('active');

                if (sequence.length === 4) {
                    processAI();
                }
            }
        }

        function processAI() {
            coins -= 1;
            document.getElementById('coin-count').innerText = coins;

            const sum = sequence.reduce((a, b) => a + b, 0) + 4;
            const resDisplay = document.getElementById('ai-result');
            
            resDisplay.innerText = "CALC...";
            
            setTimeout(() => {
                const isEven = sum % 2 === 0;
                resDisplay.innerText = isEven ? "P" : "B";
                resDisplay.style.color = isEven ? "#ff00ff" : "#00ffff";
                
                setTimeout(resetSequence, 3000);
            }, 1000);
        }

        function resetSequence() {
            sequence = [];
            document.getElementById('ai-result').innerText = "_";
            document.getElementById('ai-result').style.color = "var(--neon-green)";
            for(let i=1; i<=4; i++) {
                document.getElementById(`d${i}`).classList.remove('active');
            }
        }

        // --- LOGIC HIỆU ỨNG MATRIX CHẠY NỀN ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const matrixCharacters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890@#$%^&*()_+{}[]|:;<>?,./\\";
        const columns = canvas.width / 20; // Số cột chữ
        const drops = [];

        // Khởi tạo vị trí giọt mưa
        for (let i = 0; i < columns; i++) {
            drops[i] = 1; 
        }

        function drawMatrix() {
            // Nền đen mờ tạo hiệu ứng giọt nước rơi
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = var(--neon-green); 
            ctx.font = '20px var(--hacker-font)';

            for (let i = 0; i < drops.length; i++) {
                const text = matrixCharacters.charAt(Math.floor(Math.random() * matrixCharacters.length));
                // Vị trí vẽ chữ
                ctx.fillText(text, i * 20, drops[i] * 20);

                // Gửi giọt nước về đầu nếu ra khỏi màn hình
                if (drops[i] * 20 > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }

                // Tăng vị trí Y
                drops[i]++;
            }
        }

        // Chạy hiệu ứng
        setInterval(drawMatrix, 50);

        // Đảm bảo canvas responsive khi đổi kích thước màn hình
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

    </script>
</body>
</html>
