<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUYMANH HACKER SYSTEM</title>
    <style>
        :root {
            --neon-green: #00ff00;
            --dark-bg: #000000;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.4;
        }

        /* Container đăng nhập */
        #login-screen {
            position: relative;
            z-index: 100;
            background: rgba(0, 0, 0, 0.9);
            padding: 40px 20px;
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 20px var(--neon-green);
            text-align: center;
            width: 280px;
        }

        /* Container chính */
        #main-app {
            display: none;
            position: relative;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border: 1px solid var(--neon-green);
            text-align: center;
            width: 90%;
            max-width: 400px;
            border-radius: 15px;
        }

        input {
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 12px;
            margin: 10px 0;
            width: 80%;
            text-align: center;
            outline: none;
            font-size: 16px;
        }

        .btn-green {
            background: var(--neon-green);
            color: black;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .header-title {
            font-size: 2.2em;
            margin: 0 0 10px 0;
            letter-spacing: 5px;
            text-shadow: 0 0 10px var(--neon-green);
        }

        .coin-box { color: #ffff00; margin-bottom: 15px; font-weight: bold; }

        .ai-output {
            font-size: 4em;
            height: 80px;
            margin: 10px 0;
            color: var(--neon-green);
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .dot {
            width: 25px;
            height: 25px;
            border: 2px solid var(--neon-green);
            border-radius: 50%;
        }

        .dot.active {
            background: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .key {
            height: 55px;
            border: 1px solid var(--neon-green);
            background: rgba(0, 255, 0, 0.1);
            color: var(--neon-green);
            font-size: 1.2em;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        .key:active {
            background: var(--neon-green);
            color: black;
        }

        #error-txt { color: #ff0000; font-size: 13px; margin-top: 10px; height: 15px; }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen">
        <h2 style="margin: 0 0 20px 0;">LOGIN</h2>
        <input type="text" id="user" placeholder="Tên đăng nhập">
        <input type="password" id="pass" placeholder="Mật khẩu">
        <button class="btn-green" onclick="handleLogin()">ĐĂNG NHẬP</button>
        <div id="error-txt"></div>
    </div>

    <!-- MÀN HÌNH CHÍNH -->
    <div id="main-app">
        <div class="header-title">HUYMANH</div>
        <div class="coin-box">CREDITS: <span id="coins">100</span> XU</div>
        
        <div class="ai-output" id="result">_</div>

        <div class="dots">
            <div class="dot" id="dot1"></div>
            <div class="dot" id="dot2"></div>
            <div class="dot" id="dot3"></div>
            <div class="dot" id="dot4"></div>
        </div>

        <div class="keyboard">
            <div class="key" onclick="press(0)">0</div>
            <div class="key" onclick="press(1)">1</div>
            <div class="key" onclick="press(2)">2</div>
            <div class="key" onclick="press(3)">3</div>
            <div class="key" onclick="press(4)">4</div>
            <div class="key" onclick="press(5)">5</div>
            <div class="key" onclick="press(6)">6</div>
            <div class="key" onclick="press(7)">7</div>
            <div class="key" onclick="press(8)">8</div>
            <div class="key" onclick="press(9)">9</div>
        </div>
    </div>

    <script>
        // 1. Matrix Effect
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px arial";
            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 50);

        // 2. Login Logic
        function handleLogin() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            const err = document.getElementById('error-txt');

            // Tài khoản: huymanh123000 | Mật khẩu: huymanh123
            if (u === "huymanh123000" && p === "huymanh123") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
            } else {
                err.innerText = "Sai tài khoản hoặc mật khẩu!";
                setTimeout(() => { err.innerText = ""; }, 2000);
            }
        }

        // 3. App Logic
        let currentCoins = 100;
        let inputs = [];

        function press(n) {
            if (currentCoins <= 0) {
                alert("Bạn đã hết xu!");
                return;
            }
            if (inputs.length < 4) {
                inputs.push(n);
                document.getElementById('dot' + inputs.length).classList.add('active');
                if (inputs.length === 4) {
                    calculateResult();
                }
            }
        }

        function calculateResult() {
            currentCoins -= 1;
            document.getElementById('coins').innerText = currentCoins;
            
            const resDiv = document.getElementById('result');
            resDiv.innerText = "...";

            setTimeout(() => {
                const sum = inputs.reduce((a, b) => a + b, 0) + 4;
                const isEven = sum % 2 === 0;
                
                resDiv.innerText = isEven ? "P" : "B";
                resDiv.style.color = isEven ? "#ff00ff" : "#00ffff";

                // Tự động reset sau 2 giây để chơi tiếp
                setTimeout(resetGame, 2000);
            }, 800);
        }

        function resetGame() {
            inputs = [];
            document.getElementById('result').innerText = "_";
            document.getElementById('result').style.color = "#00ff00";
            for (let i = 1; i <= 4; i++) {
                document.getElementById('dot' + i).classList.remove('active');
            }
        }
    </script>
</body>
</html>
