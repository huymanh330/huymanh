<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUYMANH HACKER SYSTEM</title>
    <style>
        :root {
            --neon-green: #0f0;
            --dark-bg: #000;
            --hacker-font: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: var(--hacker-font);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            text-shadow: 0 0 5px var(--neon-green);
        }

        /* Màn hình đăng nhập */
        #login-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border: 2px solid var(--neon-green);
        }

        .login-box {
            border: 1px solid var(--neon-green);
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            text-align: center;
        }

        input {
            background: #000;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 10px;
            margin: 10px 0;
            outline: none;
            width: 200px;
            text-align: center;
        }

        button {
            background: var(--neon-green);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:hover {
            box-shadow: 0 0 15px var(--neon-green);
        }

        /* Giao diện chính */
        #main-app {
            display: none;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .header {
            font-size: 2.5em;
            margin-bottom: 10px;
            animation: flicker 2s infinite;
        }

        .coin-status {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: #ff0;
        }

        .display-area {
            font-size: 5em;
            height: 100px;
            margin: 10px 0;
            font-weight: bold;
        }

        .dots-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .dot {
            width: 25px;
            height: 25px;
            border: 2px solid var(--neon-green);
            border-radius: 50%;
        }

        .dot.active {
            background: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
        }

        /* Bàn phím Hacker */
        .keyboard {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 10px;
        }

        .num-key {
            width: 60px;
            height: 60px;
            border: 1px solid var(--neon-green);
            background: rgba(0, 255, 0, 0.1);
            color: var(--neon-green);
            font-size: 1.5em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .num-key:active {
            background: var(--neon-green);
            color: #000;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
            80% { opacity: 0.9; }
        }

        .error-msg { color: red; font-size: 0.8em; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen">
        <div class="login-box">
            <h2 style="margin-top:0">SYSTEM ACCESS</h2>
            <input type="text" id="username" placeholder="USER ID"><br>
            <input type="password" id="password" placeholder="ACCESS CODE"><br>
            <button onclick="login()">ENTER SYSTEM</button>
            <div id="login-error" class="error-msg"></div>
        </div>
    </div>

    <!-- ỨNG DỤNG CHÍNH -->
    <div id="main-app">
        <div class="header">HUYMANH</div>
        <div class="coin-status">CREDITS: <span id="coin-count">100</span> XU</div>
        
        <div class="display-area" id="ai-result">_</div>

        <div class="dots-container">
            <div class="dot" id="d1"></div>
            <div class="dot" id="d2"></div>
            <div class="dot" id="d3"></div>
            <div class="dot" id="d4"></div>
        </div>

        <div class="keyboard">
            <!-- Hàng 1 -->
            <div class="num-key" onclick="press(0)">0</div>
            <div class="num-key" onclick="press(1)">1</div>
            <div class="num-key" onclick="press(2)">2</div>
            <div class="num-key" onclick="press(3)">3</div>
            <div class="num-key" onclick="press(4)">4</div>
            <!-- Hàng 2 -->
            <div class="num-key" onclick="press(5)">5</div>
            <div class="num-key" onclick="press(6)">6</div>
            <div class="num-key" onclick="press(7)">7</div>
            <div class="num-key" onclick="press(8)">8</div>
            <div class="num-key" onclick="press(9)">9</div>
        </div>

        <p style="margin-top:20px; font-size: 0.7em; color: #555;">ENCRYPTED SESSION ACTIVE</p>
    </div>

    <script>
        let coins = 100;
        let sequence = [];
        const loginData = { u: "huymanh123000", p: "huymanh123" };

        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const error = document.getElementById('login-error');

            if(user === loginData.u && pass === loginData.p) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
            } else {
                error.innerText = "ACCESS DENIED: INVALID CREDENTIALS";
                setTimeout(() => error.innerText = "", 2000);
            }
        }

        function press(num) {
            if (coins <= 0) {
                alert("HẾT XU! VUI LÒNG NẠP THÊM.");
                return;
            }

            if (sequence.length < 4) {
                sequence.push(num);
                document.getElementById(`d${sequence.length}`).classList.add('active');

                if (sequence.length === 4) {
                    processAI();
                }
            }
        }

        function processAI() {
            // Trừ xu
            coins -= 1;
            document.getElementById('coin-count').innerText = coins;

            // Tính toán AI
            const sum = sequence.reduce((a, b) => a + b, 0) + 4;
            const resDisplay = document.getElementById('ai-result');
            
            resDisplay.innerText = "CALC...";
            
            setTimeout(() => {
                const isEven = sum % 2 === 0;
                resDisplay.innerText = isEven ? "P" : "B";
                resDisplay.style.color = isEven ? "#ff00ff" : "#00ffff"; // P: Tím/Hồng, B: Cyan
                
                // Reset sau 3 giây để nhập lượt mới
                setTimeout(resetSequence, 3000);
            }, 1000);
        }

        function resetSequence() {
            sequence = [];
            document.getElementById('ai-result').innerText = "_";
            document.getElementById('ai-result').style.color = "var(--neon-green)";
            for(let i=1; i<=4; i++) {
                document.getElementById(`d${i}`).classList.remove('active');
            }
        }
    </script>
</body>
</html>
